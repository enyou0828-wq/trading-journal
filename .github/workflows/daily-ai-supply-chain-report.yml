name: Daily AI Supply Chain Report

on:
  schedule:
    # 平日台北時間 07:00（UTC 前一日 23:00），盤前先產生報告。
    # UTC 日 0=週日～4=週四 對應台北隔天 1=週一～5=週五。
    - cron: "0 23 * * 0-4"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate daily AI supply chain report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_REPORT_MODEL: ${{ vars.AI_REPORT_MODEL }}
        run: python3 scripts/daily_ai_supply_chain_report.py

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ai_supply_chain_report.json
          git diff --staged --quiet || git commit -m "Daily AI supply chain report: $(date -u +'%Y-%m-%d')"
          git push
