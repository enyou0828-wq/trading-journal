name: Daily Signal Scan

on:
  schedule:
    # 每個交易日台北時間 18:00（UTC 10:00）跑，讓證交所/櫃買中心的當日資料先跑完批次
    - cron: "0 10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run daily signal scan
        run: python3 scripts/daily_signal_scan.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/price_history.csv signals/latest.json
          git diff --staged --quiet || git commit -m "Daily signal scan: $(date -u +'%Y-%m-%d')"
          git push
