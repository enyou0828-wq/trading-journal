name: Daily Signal Scan

on:
  schedule:
    # 主要排程：平日台北時間 18:00（UTC 10:00）。GitHub 的 schedule 觸發常常會延遲數小時
    # （尤其是低流量的 repo），實際執行時間可能落在午夜前後，這時候證交所/櫃買中心當天的
    # 收盤資料有時候還沒完整發布完成，會抓到「前一個交易日」的資料。
    - cron: "0 10 * * 1-5"
    # 備援排程：隔天台北時間早上 8:00（UTC 00:00，週二～週六觸發，對應補上週一～週五的資料）。
    # 這時候資料已經確定發布完成，即使晚上那次因為 GitHub 延遲或資料還沒發布而抓舊了，
    # 這次也能補上正確的資料（daily_signal_scan.py 本身是 idempotent，同一天資料已存在會直接跳過）。
    - cron: "0 0 * * 2-6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run daily signal scan
        run: python3 scripts/daily_signal_scan.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/price_history.csv signals/latest.json
          git diff --staged --quiet || git commit -m "Daily signal scan: $(date -u +'%Y-%m-%d')"
          git push
