name: Daily Update

on:
  schedule:
    # 全站資料（指數、訊號、族群、平行宇宙、盤後報告）同一次跑完、同一個 commit 更新。
    # 預定台北時間 15:37；GitHub 排程常延遲，沒跑成就在 17:43、20:19 補跑，隔天 08:13 再備援。
    # 已經有今天的個股與指數資料就直接略過，不會重複提交。
    - cron: "37 7 * * 1-5"
    - cron: "43 9 * * 1-5"
    - cron: "19 12 * * 1-5"
    - cron: "13 0 * * 2-6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-signal-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if today is already done
        id: gate
        run: |
          TODAY=$(TZ=Asia/Taipei date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] \
            && grep -q "^$TODAY,.*,TWSE," data/price_history.csv \
            && grep -q "^$TODAY,.*,TPEx," data/price_history.csv \
            && grep -q "\"$TODAY\"" data/twi_index.json \
            && grep -q "\"$TODAY\"" data/otc_index.json; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$TODAY 個股與指數資料都已經有了，略過"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Update OTC index
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true
        run: python3 scripts/update_otc_index.py

      - name: Update TWI index
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true
        run: python3 scripts/update_twi_index.py

      - name: Run daily signal scan
        if: steps.gate.outputs.skip != 'true'
        run: python3 scripts/daily_signal_scan.py

      - name: Run group analytics
        if: steps.gate.outputs.skip != 'true'
        run: python3 scripts/group_analytics.py

      - name: Run parallel universe
        if: steps.gate.outputs.skip != 'true'
        run: python3 scripts/parallel_universe.py

      - name: Build daily report and email it
        if: steps.gate.outputs.skip != 'true'
        # 沒設定這兩個 Secrets 時只產生報告、不寄信；同一資料日期只寄一次
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
        run: python3 scripts/daily_report.py --email

      - name: Commit results
        if: steps.gate.outputs.skip != 'true'
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && git diff --quiet -- data/price_history.csv data/twi_index.json data/otc_index.json; then
            echo "沒有新的收盤資料，不提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/price_history.csv data/twi_index.json data/otc_index.json signals/latest.json signals/groups.json signals/parallel.json signals/recent_ohlc.json signals/daily_report.json
          git diff --staged --quiet && exit 0
          git commit -m "Daily signal scan: $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
