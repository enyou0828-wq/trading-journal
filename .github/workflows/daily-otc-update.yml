name: Daily Index Update

on:
  # 每日指數更新已併進 Daily Update（daily-signal-scan.yml），這裡只留手動補跑
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-index-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if today is already done
        id: gate
        run: |
          TODAY=$(TZ=Asia/Taipei date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] \
            && grep -q "\"$TODAY\"" data/twi_index.json \
            && grep -q "\"$TODAY\"" data/otc_index.json; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$TODAY 指數已經更新過，略過"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Update OTC index
        if: steps.gate.outputs.skip != 'true'
        run: python3 scripts/update_otc_index.py

      - name: Update TWI index
        if: steps.gate.outputs.skip != 'true'
        run: python3 scripts/update_twi_index.py

      - name: Commit result
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/otc_index.json data/twi_index.json
          git diff --staged --quiet && exit 0
          git commit -m "Update index data: $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
