name: Daily OTC Index Update

on:
  schedule:
    # 主要排程：平日台北時間 15:30（UTC 07:30）。櫃買市場 13:30 收盤，這個時間點
    # 收盤資料通常已經確定發布完成。
    - cron: "30 7 * * 1-5"
    # 備援排程：隔天台北時間早上 8:00（UTC 00:00，週二～週六觸發，對應補上週一～週五）。
    # 萬一前一次因為 GitHub 排程延遲或資料還沒發布而抓舊了/抓空了，這次也能補上
    # 正確的數字（update_otc_index.py 本身是 idempotent，同一天資料已存在就跳過）。
    - cron: "0 0 * * 2-6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update OTC index
        run: python3 scripts/update_otc_index.py

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/otc_index.json
          git diff --staged --quiet || git commit -m "Update OTC index: $(date -u +'%Y-%m-%d')"
          git push
