<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>每日突破訊號</title>
<style>
  :root {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --text: #1d1d1f;
    --text-muted: #86868b;
    --border: rgba(0,0,0,0.08);
    --fill: rgba(118,118,128,0.12);
    --accent: #0071e3;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 20px rgba(0,0,0,0.04);
    /* 台股慣例：紅漲綠跌 */
    --up: #d70015;
    --down: #248a3d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --surface: #1c1c1e;
      --text: #f5f5f7;
      --text-muted: #8e8e93;
      --border: rgba(255,255,255,0.10);
      --fill: rgba(118,118,128,0.24);
      --accent: #2997ff;
      --shadow: none;
      --up: #ff453a;
      --down: #30d158;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 48px 20px 80px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.003em;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 40px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; margin: 0 0 8px; }
  .meta { color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }
  #sets h2 { font-size: 22px !important; font-weight: 600; letter-spacing: -0.015em; margin: 36px 0 14px !important; }
  #sets h2:first-child { margin-top: 0 !important; }
  .card {
    background: var(--surface);
    border-radius: 18px;
    padding: 18px 22px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: transform .2s cubic-bezier(.2,.8,.2,1);
  }
  @media (hover: hover) { .card:hover { transform: translateY(-2px); } }
  .card-top { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .code { font-weight: 700; font-size: 19px; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .name { color: var(--text-muted); font-size: 15px; margin-left: 8px; }
  .multiple { color: var(--accent); font-weight: 600; font-size: 14px; background: var(--fill); padding: 3px 12px; border-radius: 980px; font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 8px 20px; flex-wrap: wrap; margin-top: 10px; font-size: 14px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .card p { color: var(--text); }
  .empty { color: var(--text-muted); text-align: center; padding: 40px 0; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); }
  @media (max-width: 560px) { body { padding: 28px 16px 60px; } h1 { font-size: 32px; } }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>每日突破訊號</h1>
  <div class="meta" id="meta">載入中…</div>
  <div id="sets"></div>
</div>

<script>
function renderGroupRotationSet(groups) {
  const cardsHtml = groups.length
    ? groups.map(group => {
        const stocksLine = group.stocks.map(s =>
          `<strong>${s.code}</strong> ${s.name} <span style="color:var(--up)">+${s.daily_change_pct}%</span>`
        ).join('　');
        return `
          <div class="card">
            <div class="card-top">
              <div><strong>${group.group}</strong></div>
              <div class="multiple">${group.triggered_count}/${group.total_in_group}家噴出</div>
            </div>
            <p style="margin:8px 0 0;font-size:0.85rem;line-height:1.8;">${stocksLine}</p>
          </div>
        `;
      }).join('')
    : '<div class="empty">今天沒有族群同步噴出</div>';

  return `
    <h2 style="margin:24px 0 10px;font-size:1.05rem;">族群同步噴出</h2>
    ${cardsHtml}
  `;
}

function renderSet(set) {
  const cardsHtml = set.signals.length
    ? set.signals.map(s => {
        const changeColor = s.daily_change_pct == null ? 'var(--text-muted)' : s.daily_change_pct > 0 ? 'var(--up)' : s.daily_change_pct < 0 ? 'var(--down)' : 'var(--text-muted)';
        const changeText = s.daily_change_pct == null ? '–' : (s.daily_change_pct > 0 ? '+' : '') + s.daily_change_pct + '%';
        const groupText = s.industry && s.sub_group ? `${s.industry} · ${s.sub_group}` : (s.industry || s.sub_group || '–');
        const vcpRow = s.consolidation_days != null
          ? `<div class="row"><span>整理 ${s.consolidation_days} 天</span><span>收縮 ${s.contraction_count} 次</span><span>突破價 ${s.breakout_level}</span><span>前低 ${s.last_contraction_low}</span></div>`
          : '';
        return `
          <div class="card">
            <div class="card-top">
              <div><span class="code">${s.code}</span><span class="name">${s.name}</span></div>
              <div class="multiple">${s.volume != null ? Math.round(s.volume / 1000).toLocaleString('zh-TW') + '張' : '–'}</div>
            </div>
            <div class="row">
              <span>收盤 ${s.close != null ? s.close : '–'}</span>
              <span style="color:${changeColor}">當日 ${changeText}</span>
              <span>${groupText}</span>
            </div>
            ${vcpRow}
          </div>
        `;
      }).join('')
    : '<div class="empty">今天沒有符合條件的訊號</div>';

  return `
    <h2 style="margin:24px 0 10px;font-size:1.05rem;">${set.label}</h2>
    ${cardsHtml}
  `;
}

async function load() {
  const metaEl = document.getElementById('meta');
  const setsEl = document.getElementById('sets');
  try {
    const res = await fetch('signals/latest.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    const dateText = data.markets_in_sync === false
      ? `上市 ${data.twse_date}／上櫃 ${data.tpex_date}（尚未同步，其中一邊還沒發布最新資料）`
      : `資料日期：${data.scan_date}`;
    metaEl.textContent = `${dateText}　產生時間：${new Date(data.generated_at).toLocaleString('zh-TW')}`;
    const groups = data.group_rotation ? data.group_rotation.groups : [];
    setsEl.innerHTML = data.sets.map(renderSet).join('') + renderGroupRotationSet(groups);
  } catch (e) {
    metaEl.textContent = '';
    setsEl.innerHTML = `<div class="empty">讀取失敗：${e.message}</div>`;
  }
}
load();
</script>
</body>
</html>
