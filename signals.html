<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日突破訊號</title>
<style>
  :root {
    --bg: #f9f9f7;
    --surface: #ffffff;
    --text: #0b0b0b;
    --text-muted: #898781;
    --border: rgba(11,11,11,0.10);
    --accent: #2a78d6;
    --up: #1baf7a;
    --down: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413;
      --surface: #1e1e1c;
      --text: #f2f1ee;
      --text-muted: #9a988f;
      --border: rgba(255,255,255,0.12);
      --accent: #5b9bef;
      --up: #33d19a;
      --down: #e35b5b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 60px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .meta { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; }
  .warmup {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 0.9rem;
    margin-bottom: 20px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .card-top { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .code { font-weight: 600; font-size: 1.05rem; }
  .name { color: var(--text-muted); font-size: 0.9rem; margin-left: 6px; }
  .multiple { color: var(--up); font-weight: 600; }
  .row { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 8px; font-size: 0.85rem; color: var(--text-muted); }
  .empty { color: var(--text-muted); text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>每日突破訊號</h1>
  <div class="meta" id="meta">載入中…</div>
  <div id="sets"></div>
</div>

<script>
function renderGroupRotationSet(groups) {
  const cardsHtml = groups.length
    ? groups.map(group => {
        const stocksLine = group.stocks.map(s =>
          `<strong>${s.code}</strong> ${s.name} <span style="color:var(--up)">+${s.daily_change_pct}%</span>`
        ).join('　');
        return `
          <div class="card">
            <div class="card-top">
              <div><strong>${group.group}</strong></div>
              <div class="multiple">${group.triggered_count}/${group.total_in_group}家噴出</div>
            </div>
            <p style="margin:8px 0 0;font-size:0.85rem;line-height:1.8;">${stocksLine}</p>
          </div>
        `;
      }).join('')
    : '<div class="empty">今天沒有族群同步噴出</div>';

  return `
    <h2 style="margin:24px 0 10px;font-size:1.05rem;">族群同步噴出</h2>
    ${cardsHtml}
  `;
}

function renderSet(set) {
  const warmupHtml = set.warmup
    ? `<div class="warmup">提醒：部分股票累積歷史還不到門檻天數，暖機期尚未結束，訊號會隨著每天累積資料陸續補齊。</div>`
    : '';
  const cardsHtml = set.signals.length
    ? set.signals.map(s => {
        const changeColor = s.daily_change_pct == null ? 'var(--text-muted)' : s.daily_change_pct > 0 ? 'var(--up)' : s.daily_change_pct < 0 ? 'var(--down)' : 'var(--text-muted)';
        const changeText = s.daily_change_pct == null ? '–' : (s.daily_change_pct > 0 ? '+' : '') + s.daily_change_pct + '%';
        const groupText = s.industry && s.sub_group ? `${s.industry} · ${s.sub_group}` : (s.industry || s.sub_group || '–');
        return `
          <div class="card">
            <div class="card-top">
              <div><span class="code">${s.code}</span><span class="name">${s.name}</span></div>
              <div class="multiple">${s.volume != null ? Math.round(s.volume / 1000).toLocaleString('zh-TW') + '張' : '–'}</div>
            </div>
            <div class="row">
              <span>收盤 ${s.close != null ? s.close : '–'}</span>
              <span style="color:${changeColor}">當日 ${changeText}</span>
              <span>${groupText}</span>
            </div>
          </div>
        `;
      }).join('')
    : '<div class="empty">今天沒有符合條件的訊號</div>';

  return `
    <h2 style="margin:24px 0 10px;font-size:1.05rem;">${set.label}</h2>
    ${warmupHtml}
    ${cardsHtml}
  `;
}

async function load() {
  const metaEl = document.getElementById('meta');
  const setsEl = document.getElementById('sets');
  try {
    const res = await fetch('signals/latest.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    metaEl.textContent = `資料日期：${data.scan_date}　產生時間：${new Date(data.generated_at).toLocaleString('zh-TW')}`;
    const groups = data.group_rotation ? data.group_rotation.groups : [];
    setsEl.innerHTML = data.sets.map(renderSet).join('') + renderGroupRotationSet(groups);
  } catch (e) {
    metaEl.textContent = '';
    setsEl.innerHTML = `<div class="empty">讀取失敗：${e.message}</div>`;
  }
}
load();
</script>
</body>
</html>
